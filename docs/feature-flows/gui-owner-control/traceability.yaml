version: 1
feature_id: gui.owner-control
title: Bounded human Owner GUI control
status: implemented
characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: true
  security_sensitive: true
nodes:
  T4:
    kind: transition
    description: Retain nonsecret exact operation references before sending a mutation
    entity: BrowserPendingReference
    from: NO_PENDING
    to: PENDING
    trigger: Explicit commit before the network request
    code:
      - path: src/gui/owner-ui.ts
        symbol: rememberPending
    tests:
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI does not send a mutation when its pending reference cannot be retained
  T5:
    kind: transition
    description: Clear confirmed operation references without retrying the mutation
    entity: BrowserPendingReference
    from: PENDING
    to: NO_PENDING
    trigger: Exact matching receipt or confirmed stale preview or rolled back mutation
    code:
      - path: src/gui/owner-ui.ts
        symbol: clearPending
    tests:
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI reload recovers the exact applied operation after a lost response without another commit
  E1:
    kind: entry
    description: Human activates bounded Owner GUI through canonical direct command
    trigger: /kingdom owner.gui strict JSON with optional non-authorizing taskHint/itemHint/contentHashHint and hintAction ack|ask
    code:
      - path: src/index.ts
        symbol: owner.gui
      - path: src/gui/owner-control.ts
        symbol: validateLaunchAckHint
      - path: src/gui/workbench-ui.ts
        symbol: ownerLaunchCommand
    failure_behavior: An incomplete, malformed or duplicated hint, or an invalid hintAction, is rejected before activation with no window, no decision fact and no ticket URL
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: the workbench copy icon produces the exact minimal direct owner.gui command and really copies it on click
      - path: tests/owner-delivery-ack.test.ts
        symbol: owner.gui hint fields are validated as a whole, rejected before activation, and never widen authorization
      - path: tests/v13-owner-direct-ingress.test.ts
        symbol: canonical command reaches independent Owner HTTP and atomic bootstrap without a role session
  D1:
    kind: decision
    description: Validate direct capability and exact decision scope
    condition: Capability is canonical and all kingdom, action, resource and expiry fields are valid
    code:
      - path: src/core/owner-window.ts
        symbol: activate
    tests:
      - path: tests/owner-window.test.ts
        symbol: Catalog and authority are fully scoped; exposed JSON/handle copies do not grant authority
  T1:
    kind: transition
    description: Record an existing kingdom human control decision
    entity: OwnerDecision
    from: Absent
    to: RECORDED
    trigger: Valid direct activation
    code:
      - path: src/core/owner-window.ts
        symbol: activate
    tests:
      - path: tests/owner-window.test.ts
        symbol: Owner GUI complete management chain records stable human actor, exact sources and durable receipts
  A1:
    kind: action
    description: Redeem short single-use ticket and remove it from the browser URL
    code:
      - path: src/gui/owner-control.ts
        symbol: OwnerLocalControlManager
      - path: src/gui/owner-control.ts
        symbol: launchRedirectPath
    failure_behavior: A replayed or expired ticket redeems nothing; the redirect never carries the ticket and preserves the hint action (ack_* or ask_*)
  E2:
    kind: entry
    description: Prepare a structured management action including typed kingdom soft-budget form values
    trigger: POST /api/owner/prepare
    code:
      - path: src/gui/owner-control.ts
        symbol: prepare
      - path: src/gui/owner-ui.ts
        symbol: payload
      - path: src/gui/owner-ui.ts
        symbol: renderFields
    tests:
      - path: tests/v14-cost-gui.test.ts
        symbol: Owner budget form sends typed numbers and booleans and rejects fractional or missing quota values
  D2:
    kind: decision
    description: Verify independent browser transport and decision bounds
    condition: Exact local Host, Origin and CSRF match an active decision with the requested action and resource scope
    code:
      - path: src/gui/owner-control.ts
        symbol: OwnerLocalControlManager
      - path: src/core/owner-window.ts
        symbol: prepare
    tests:
      - path: tests/gui-owner-control.test.ts
        symbol: owner control reads reject cross Origin, same-site metadata, duplicate cookie and wrong Host
      - path: tests/gui-owner-control.test.ts
        symbol: owner mutation rejects missing CSRF, authority injection, duplicate fields, and oversized body
  A2:
    kind: action
    description: Validate relevant runtime objects or current kingdom budget policy and pin normalized parameters and related state
    code:
      - path: src/core/owner-window.ts
        symbol: prepare
      - path: src/index.ts
        symbol: validateExecutionProfile
      - path: src/core/owner-window.ts
        symbol: budget.policy
      - path: src/core/budget.ts
        symbol: normalizeBudgetPolicyParameters
    external_call:
      system: DSH live Session registry and model metadata only for actions requiring runtime validation
      timeout: Default 10 seconds, at most 30 seconds and bounded by decision expiry
      failure_behavior: Abort on timeout or revocation, reject unavailable identity or model, never dispatch
      failure_nodes: [X2]
      retry:
        max_attempts: 1
        backoff: None
  E3:
    kind: entry
    description: Explicitly submit the already prepared operation
    trigger: POST /api/owner/commit with prepareId and operationId only
    code:
      - path: src/core/owner-window.ts
        symbol: commit
  D3:
    kind: decision
    description: Identify a previously committed identical operation
    condition: Existing receipt has the same operation ID and prepared content
    code:
      - path: src/core/owner-window.ts
        symbol: receipt
      - path: src/core/owner-window.ts
        symbol: commit
    tests:
      - path: tests/owner-window.test.ts
        symbol: Concurrent identical commits, lost response and post-revoke receipt read perform exactly one mutation
  D4:
    kind: decision
    description: Revalidate authorization, related facts and unresolved work before commit
    condition: Decision is active and related facts match; topology-sensitive actions require no affected unresolved work, while budget policy updates preserve in-flight work
    code:
      - path: src/core/owner-window.ts
        symbol: commit
    tests:
      - path: tests/owner-window.test.ts
        symbol: Commit revalidates registry, abort and current objects after every asynchronous boundary
      - path: tests/owner-window.test.ts
        symbol: An older unreleased Lease blocks topology even when the newest execution is terminal
      - path: tests/owner-window.test.ts
        symbol: Retired previous Supervisor is a historical relationship, while its unsettled work still blocks replacement
  T2:
    kind: transition
    description: Atomically apply the exact operation and append its receipt
    entity: OwnerOperation
    from: Prepared
    to: APPLIED
    trigger: Valid explicit commit, including single-use initialization bootstrap
    code:
      - path: src/core/owner-window.ts
        symbol: commit
      - path: src/core/db.ts
        symbol: withImmediateTransaction
    tests:
      - path: tests/owner-window.test.ts
        symbol: Receipt write failure rolls back the business object and business event
      - path: tests/owner-window.test.ts
        symbol: Bootstrap is one-shot, atomic, concurrent-safe and does not promote to an ordinary management window
  E4:
    kind: entry
    description: Revoke the current window without waiting for ordinary mutation busy
    trigger: Explicit revoke, expiry, replacement or plugin unload
    code:
      - path: src/gui/owner-control.ts
        symbol: dispose
      - path: src/core/owner-window.ts
        symbol: revoke
  T3:
    kind: transition
    description: Record explicit revocation of an active decision in an existing kingdom
    entity: OwnerDecision
    from: RECORDED
    to: REVOKED
    trigger: Explicit revoke of a still-active existing-kingdom decision
    code:
      - path: src/core/owner-window.ts
        symbol: revoke
    tests:
      - path: tests/owner-window.test.ts
        symbol: Expiry, replacement and disposal invalidate writing without altering completed receipts
  G1:
    kind: safeguard
    description: Human authority stays separate from Agent and browser identities
    safeguard_type: authorization
    guarantee: Tools and old Role cookies cannot mint or expand an OwnerDecision
    protects: [D1, D2]
    failure_behavior: Reject with no authority or business writes
    code:
      - path: src/core/owner-control.ts
        symbol: requireOwnerControl
      - path: src/gui/owner-control.ts
        symbol: OwnerLocalControlManager
    tests:
      - path: tests/v13-owner-direct-ingress.test.ts
        symbol: canonical command reaches independent Owner HTTP and atomic bootstrap without a role session
      - path: tests/gui-owner-control.test.ts
        symbol: owner HTTP uses a separate one-time ticket and cookie with no Role/bearer upgrade
  G2:
    kind: safeguard
    description: Prepared content, exact operation capability and atomic receipt prevent duplicate writes
    safeguard_type: idempotency
    guarantee: A successful operation applies once and records honest Owner provenance in the same transaction
    protects: [T2]
    failure_behavior: Roll back on failure, reject mismatched replay and query receipts after uncertain responses
    code:
      - path: src/core/owner-window.ts
        symbol: commit
      - path: src/core/owner-control.ts
        symbol: issueOwnerOperationCapability
      - path: src/gui/owner-ui.ts
        symbol: rememberPending
      - path: src/gui/owner-ui.ts
        symbol: lookupReceipt
    tests:
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI reload recovers the exact applied operation after a lost response without another commit
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI confirmed stale rejection preserves input and permits a new preview without resubmitting
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI unresolved receipts and replaced decisions retain the original reference and block new work
      - path: tests/gui-owner-ui-recovery.test.ts
        symbol: Owner UI does not send a mutation when its pending reference cannot be retained
      - path: tests/owner-window.test.ts
        symbol: One-operation Core capability requires instance identity, realm, exact action and complete parameters
      - path: tests/owner-window.test.ts
        symbol: Concurrent identical commits, lost response and post-revoke receipt read perform exactly one mutation
      - path: tests/owner-window.test.ts
        symbol: Receipt write failure rolls back the business object and business event
  G3:
    kind: safeguard
    description: Recheck lifetime after asynchronous work and before synchronous transaction
    safeguard_type: authorization
    guarantee: Revoked or expired decisions cannot finish a new write, and revocation never releases active Leases
    protects: [D4, A3]
    failure_behavior: Abort validation, retain unresolved execution state and require new valid preparation
    code:
      - path: src/core/owner-window.ts
        symbol: revoke
      - path: src/core/owner-window.ts
        symbol: commit
    tests:
      - path: tests/owner-window.test.ts
        symbol: Revoke interrupts validation that ignores AbortSignal and prevents writes
      - path: tests/owner-window.test.ts
        symbol: Bounded validation timeout never leaves an operation in progress or writes facts
      - path: tests/gui-owner-control.test.ts
        symbol: owner revoke bypasses busy preparation, aborts awaiting validation, and prevents later commit
  X1:
    kind: outcome
    description: Activation rejected
    result: No browser write window
  X2:
    kind: outcome
    description: Preparation or commit rejected
    result: Preserve input and explain missing authority, changed state or unresolved work
  X3:
    kind: outcome
    description: Prepared preview
    result: Exact before and after values, affected objects and server-issued IDs
  X4:
    kind: outcome
    description: Operation result
    result: APPLIED receipt with stable Owner principal and true source channels
  X5:
    kind: outcome
    description: Window no longer writable
    result: Keep historical decisions, receipts and all active execution facts
  A3:
    kind: action
    description: Invalidate in-memory authority and abort pending validation without releasing any execution lease
    code:
      - path: src/core/owner-window.ts
        symbol: invalidate
      - path: src/gui/owner-control.ts
        symbol: invalidate
  D5:
    kind: decision
    description: Only explicit revocation of an active existing-kingdom decision appends a revocation event
    condition: wasActive is true and kingdomId and ownerId exist during revoke
    code:
      - path: src/core/owner-window.ts
        symbol: revoke
    tests:
      - path: tests/owner-window.test.ts
        symbol: Expiry, replacement and disposal invalidate writing without altering completed receipts
  E5:
    kind: entry
    description: Query an uncertain operation using its original decision reference
    trigger: GET /api/owner/receipts/:operationId with X-Kingdom-Decision-Id
    code:
      - path: src/gui/owner-control.ts
        symbol: handleOwnerRequest
  D6:
    kind: decision
    description: Reject a replaced window or an expired read grace instead of querying another decision
    condition: Cookie handle matches the original decisionId and receipt grace has not expired
    code:
      - path: src/gui/owner-control.ts
        symbol: receipt
    tests:
      - path: tests/gui-owner-control.test.ts
        symbol: owner receipt lookup detects a replaced window and never reports the old operation as unrecorded
      - path: tests/gui-owner-control.test.ts
        symbol: owner receipt grace survives write expiry but expires server-side after five minutes
  A4:
    kind: action
    description: Read only the original operation receipt without issuing a new write
    code:
      - path: src/core/owner-window.ts
        symbol: receipt
  D7:
    kind: decision
    description: Distinguish an applied receipt from an unresolved result
    condition: The original prepared operation has a matching committed receipt
    code:
      - path: src/core/owner-window.ts
        symbol: receipt
      - path: src/gui/owner-ui.ts
        symbol: "el('lookup').addEventListener"
    tests:
      - path: tests/gui-owner-control.test.ts
        symbol: owner commit pins both IDs and uses receipts for duplicate requests and response-loss lookup
  G4:
    kind: safeguard
    description: Receipt reads stay bound to the original decision and never cause automatic resend
    safeguard_type: integrity
    guarantee: Replacing the browser cookie cannot turn another decision lookup into evidence that the old operation never applied
    protects: [D6, A4]
    failure_behavior: Show original decision and operation references and retain an unresolved result
    code:
      - path: src/gui/owner-control.ts
        symbol: receipt
      - path: src/gui/owner-ui.ts
        symbol: "el('lookup').addEventListener"
    tests:
      - path: tests/gui-owner-control.test.ts
        symbol: owner receipt lookup detects a replaced window and never reports the old operation as unrecorded
      - path: tests/gui-owner-ui.test.ts
        symbol: owner UI keeps receipt lookup distinct from commit and never interpolates runtime values into HTML
  X6:
    kind: outcome
    description: Original operation remains unconfirmed
    result: Preserve original references and do not resend or claim no side effect
  E6:
    kind: entry
    description: Workbench acknowledgement icon opens the Owner window with an exact task/item/contentHash reference
    trigger: GET /owner?ack_task=…&ack_item=…&ack_hash=…
    code:
      - path: src/gui/workbench-ui.ts
        symbol: ownerAckHref
      - path: src/gui/owner-ui.ts
        symbol: ackTargetFromLocation
    failure_behavior: Malformed, duplicated or incomplete parameters produce no target
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: workbench acknowledgement hands the exact task/item/contentHash to the Owner window without writing
  D8:
    kind: decision
    description: Preselect only an exact three-way match inside the active, in-scope catalog
    condition: OwnerDecision is ACTIVE, delivery.item.ack is in scope, and one catalog entry matches all of taskId, itemId and contentHash; the catalog is ordered by the delivery's most recent update or acceptance, so a late-accepted older delivery stays inside the bounded catalog exactly where the workbench shows it
    code:
      - path: src/gui/owner-ui.ts
        symbol: ackTargetFromLocation
      - path: src/gui/owner-ui.ts
        symbol: renderFields
      - path: src/gui/owner-ui.ts
        symbol: load
      - path: src/core/owner-window.ts
        symbol: deliveryItems
    failure_behavior: Keep no alternative selection, explain the mismatch, and issue no mutation request
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window preselects only an exact task/item/contentHash triple and never writes by itself
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window refuses an out-of-scope acknowledgement target instead of widening authority
      - path: tests/owner-delivery-ack.test.ts
        symbol: a delivery created before the cap but accepted later stays acknowledgeable and its change stays readable
  A5:
    kind: action
    description: Show the preselected item content and version, and still require prepare, preview, commit and receipt
    code:
      - path: src/gui/owner-ui.ts
        symbol: renderFields
      - path: src/gui/owner-ui.ts
        symbol: payload
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window acknowledgement is scoped, idempotent and never touches task or review state
  X7:
    kind: outcome
    description: Target not locatable in the current window
    result: No fallback selection, no request and no fact; the Owner must re-read or reactivate the correct scope
  G5:
    kind: safeguard
    description: Preselection grants no authority and never auto-commits
    safeguard_type: authorization
    guarantee: The URL only preselects a catalog entry; prepare and commit still require the exact Owner window and CSRF
    protects: [D8, A5]
    failure_behavior: Zero mutation requests on mismatch; no sessionStorage or ticket alias chain is introduced
    code:
      - path: src/gui/owner-ui.ts
        symbol: renderFields
      - path: src/gui/owner-control.ts
        symbol: handleOwnerRequest
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window refuses an out-of-scope acknowledgement target instead of widening authority
  E7:
    kind: entry
    description: Workbench change icon opens the Owner page with an exact task/evidence/entry triple
    trigger: Explicit change icon activation on a supervisor-confirmed change item
    code:
      - path: src/gui/workbench-ui.ts
        symbol: ownerChangeHref
      - path: src/gui/owner-ui.ts
        symbol: changeTargetFromLocation
  D9:
    kind: decision
    description: An active Owner window authorized for delivery.item.ack, covered scope and a re-verified supervisor-confirmed evidence are all present
    condition: Window ACTIVE with delivery.item.ack in its action set, deliveryScopeAllows the task territory, the ACCEPT payload binds this evidence, the manifest hash re-verifies and the entry is still in the effective catalog
    code:
      - path: src/core/owner-window.ts
        symbol: readDeliveryChange
      - path: src/core/delivery-change.ts
        symbol: verifyChangeManifest
    failure_behavior: Explicit rejection with no diff body, no event write and no acknowledgement
    tests:
      - path: tests/delivery-change-evidence.test.ts
        symbol: the Owner read path refuses unstarted windows, out-of-scope deliveries, unrecognized entries and path traversal
      - path: tests/delivery-change-boundary.test.ts
        symbol: an Owner window without delivery.item.ack cannot read change bodies even inside the same territory scope
  X9:
    kind: outcome
    description: Change detail is unavailable or out of scope
    result: No body returned; the page explains why and never substitutes another item
  A6:
    kind: action
    description: Return the bounded read-only change detail over the same-origin read route
    code:
      - path: src/gui/owner-control.ts
        symbol: readChange
      - path: src/gui/owner-ui.ts
        symbol: renderChange
    tests:
      - path: tests/delivery-change-evidence.test.ts
        symbol: the Owner page renders a strict read-only change view and the real HTTP read route enforces window, scope and exact ids
  G6:
    kind: safeguard
    description: Reading a change never writes a fact and never claims authorship
    safeguard_type: audit
    guarantee: The read route accepts only the three exact ids, requires a window authorized for delivery.item.ack, returns bounded re-verified text and leaves the ledger untouched
    protects: [D9, A6]
    failure_behavior: 400 on malformed parameters, 401 without a window, refusal without the acknowledgement action, on drift or when the entry left the effective delivery catalog; zero facts and no acknowledgement
    code:
      - path: src/gui/owner-control.ts
        symbol: handleOwnerRequest
      - path: src/core/owner-window.ts
        symbol: readDeliveryChange
    tests:
      - path: tests/delivery-change-evidence.test.ts
        symbol: the Owner page renders a strict read-only change view and the real HTTP read route enforces window, scope and exact ids
      - path: tests/delivery-change-boundary.test.ts
        symbol: an Owner window without delivery.item.ack cannot read change bodies even inside the same territory scope
  E8:
    kind: entry
    description: Workbench question icon opens the Owner page with an exact task/item/contentHash triple
    trigger: GET /owner?ask_task=…&ask_item=…&ask_hash=…
    code:
      - path: src/gui/workbench-ui.ts
        symbol: ownerAskHref
      - path: src/gui/owner-ui.ts
        symbol: askTargetFromLocation
    failure_behavior: Malformed, duplicated or incomplete parameters produce no target and disable preparation
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window exposes the separate question action, preselects only the exact item and reports an illegal hint
  D10:
    kind: decision
    description: The window is active, authorized for delivery.item.question, exactly matching one catalog item and the delivery is still confirmed by the accepting supervisor
    condition: OwnerDecision ACTIVE with delivery.item.question in its action set (the same in-scope confirmed-delivery catalog is returned whenever either delivery.item.ack or delivery.item.question is authorized), deliveryScopeAllows the task territory, one catalog entry matches taskId/itemId/contentHash, the same Task/attempt supervisor ACCEPT still classifies, and the TASK_ACCEPTED actor_id and payload reviewer_binding_id are both non-empty and equal
    code:
      - path: src/gui/owner-ui.ts
        symbol: renderFields
      - path: src/core/owner-window.ts
        symbol: catalog
      - path: src/core/owner-window.ts
        symbol: deliveryItems
      - path: src/core/owner-window.ts
        symbol: context
      - path: src/core/delivery-ack.ts
        symbol: deliveryReviewerBindingId
    failure_behavior: No preselection, no substitution and zero question facts; the refusal names the failed condition
    tests:
      - path: tests/delivery-question-loop.test.ts
        symbol: the question action is authorized separately from acknowledgement and refuses stale or forged references with zero writes
      - path: tests/delivery-question-loop.test.ts
        symbol: a question is refused for an unconfirmed delivery and for a window without the action
      - path: tests/delivery-question-loop.test.ts
        symbol: a receiver is only directed when both the event actor and payload reviewer field are non-empty and equal
      - path: tests/owner-delivery-ack.test.ts
        symbol: a question-only window receives the real same-scope delivery catalogue and the page submits only that exact triple
  A7:
    kind: action
    description: Preselect the exact item, require the Owner to write the question text, and preview the exact effect
    code:
      - path: src/gui/owner-ui.ts
        symbol: renderFields
      - path: src/gui/owner-ui.ts
        symbol: payload
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: Owner window exposes the separate question action, preselects only the exact item and reports an illegal hint
  T8:
    kind: transition
    description: Append one bounded Owner question fact in the canonical Owner transaction; question identity is the Owner operation, so a new operation with identical text is a new independent fact
    entity: OwnerDeliveryItemQuestion
    from: Absent
    to: QUESTIONED
    trigger: Owner commits the prepared delivery.item.question operation
    code:
      - path: src/core/owner-window.ts
        symbol: commit
      - path: src/core/delivery-ack.ts
        symbol: recordDeliveryQuestion
      - path: src/core/delivery-ack.ts
        symbol: deliveryQuestionEventId
    tests:
      - path: tests/delivery-question-loop.test.ts
        symbol: the canonical Owner window records exactly one bounded question fact and is idempotent on retry
      - path: tests/delivery-question-loop.test.ts
        symbol: question text is redacted before it becomes a fact
  X10:
    kind: outcome
    description: Question not submittable
    result: No question fact; the page explains the mismatch, keeps no alternative selection and claims no notification
  E9:
    kind: entry
    description: Owner reads back the questions and replies of one exact item
    trigger: GET /api/owner/delivery-questions?task=…&item=…
    code:
      - path: src/gui/owner-ui.ts
        symbol: renderQuestions
    failure_behavior: 400 on malformed parameters, 401 without a window, refusal without the question action or outside scope
    tests:
      - path: tests/owner-delivery-ack.test.ts
        symbol: a real HTTP ticket redemption 303s to the exact ack query and a fresh empty-sessionStorage page preselects it with zero writes
  D11:
    kind: decision
    description: Only an active window authorized for delivery.item.question with covered scope may read question or reply bodies; each question is labelled verified-current, historical or unverifiable
    condition: Window ACTIVE, delivery.item.question in scope, deliveryScopeAllows the task territory, and the exact itemId has recorded questions for this delivery; the version relation is re-derived per exact task/item with no display-catalogue limit, so an item still current beyond the bounded catalogue stays CURRENT, a revised item is HISTORICAL, and an item the current ACCEPT/evidence can no longer re-derive (for example lost CHANGE evidence) is returned as UNVERIFIABLE and is never presented as current or replyable
    code:
      - path: src/core/owner-window.ts
        symbol: readDeliveryQuestions
      - path: src/core/delivery-ack.ts
        symbol: readDeliveryItemVersion
      - path: src/core/delivery-ack.ts
        symbol: classifyDeliveryItemVersion
    failure_behavior: Explicit rejection with no body, no event write, no acknowledgement and no reply on behalf of the supervisor
    tests:
      - path: tests/delivery-question-loop.test.ts
        symbol: the read-only question thread requires an active window, the action and an exact current item
      - path: tests/delivery-question-loop.test.ts
        symbol: the question action never grants acknowledgement and the acknowledgement action never grants questions
      - path: tests/delivery-question-loop.test.ts
        symbol: a second item in the same delivery keeps its own question thread and is not hidden by the first item
      - path: tests/delivery-change-evidence.test.ts
        symbol: a supervisor-confirmed CHANGE entry is questionable and answerable, and evidence drift fails closed
      - path: tests/owner-delivery-ack.test.ts
        symbol: an exact question read re-verifies its item beyond the bounded display catalogue instead of calling it unverifiable
  A8:
    kind: action
    description: Return the question and reply bodies read-only with each question's current/historical/unverifiable version relation and the accepting supervisor's current reachability
    code:
      - path: src/gui/owner-control.ts
        symbol: readQuestions
      - path: src/gui/owner-ui.ts
        symbol: renderQuestions
      - path: src/core/delivery-ack.ts
        symbol: classifyDeliveryReplyAccess
      - path: src/core/delivery-ack.ts
        symbol: classifyDeliveryItemVersion
    tests:
      - path: tests/delivery-question-loop.test.ts
        symbol: snapshots, task detail, recent events and event polling never expose the question or reply body
      - path: tests/owner-delivery-ack.test.ts
        symbol: the question panel labels every card and a slow older read never overwrites a faster re-selection
      - path: tests/owner-delivery-ack.test.ts
        symbol: the question panel labels real current and historical cards from Core without promising a reachability it never shows
