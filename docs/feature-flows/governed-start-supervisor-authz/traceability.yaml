version: 1
feature_id: "governed-start.supervisor-authz"
title: "Authorize and dispatch public governed start through the DSH caller session"
status: "implemented"

characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: true
  security_sensitive: true

nodes:
  E0:
    kind: entry
    description: Human Owner independently invokes the direct local capability-ceiling Slash command
    trigger: /kingdom ceiling with a boolean map or clear=true
    code:
      - path: src/index.ts
        symbol: "case 'ceiling'"
      - path: src/capability/admin.ts
        symbol: setCapabilityCeiling
    tests:
      - path: tests/owner-control-plane.test.ts
        symbol: "Owner Control direct Slash 原子 init、Owner actor 与 Tool zero-write"
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: clear is an auditable fail-closed reset"

  E1:
    kind: entry
    description: Headless user requests governed Task execution after plan and assign
    trigger: kingdom_start_task_governed Tool invocation
    code:
      - path: src/index.ts
        symbol: kingdom_start_task_governed

  E2:
    kind: entry
    description: Caller independently invokes the legacy one-shot compatibility Tool
    trigger: kingdom_start_task Tool invocation
    code:
      - path: src/index.ts
        symbol: kingdom_start_task
    tests:
      - path: tests/owner-control-plane.test.ts
        symbol: "LEGACY_COMPAT machine gate rejects implicit one-shot selection"

  D0:
    kind: decision
    description: Separate legacy compatibility request explicitly opts in
    condition: kingdom_start_task receives legacy_opt_in exactly true
    code:
      - path: src/index.ts
        symbol: kingdom_start_task
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "headless route contract: governed is canonical and legacy requires explicit opt-in"
      - path: tests/owner-control-plane.test.ts
        symbol: "LEGACY_COMPAT machine gate rejects implicit one-shot selection"

  A0:
    kind: action
    description: Enter the canonical governed persistent start seam independently of Owner ceiling setup and the legacy Tool
    code:
      - path: src/index.ts
        symbol: runGovernedStart
      - path: src/index.ts
        symbol: kingdom_start_task_governed

  A5:
    kind: action
    description: Persist or clear the capability ceiling and append its audit event through direct local Owner Slash
    code:
      - path: src/index.ts
        symbol: ownerWrite
      - path: src/capability/admin.ts
        symbol: setCapabilityCeiling
    tests:
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: only direct Owner Control may configure a ceiling"
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: clear is an auditable fail-closed reset"

  D5:
    kind: decision
    description: Ceiling set or clear request has direct Owner control and valid input
    condition: direct OwnerControlCapability is present and the request is clear=true or a JSON object whose keys are non-empty and values are booleans; an empty object is valid
    code:
      - path: src/core/owner-control.ts
        symbol: requireOwnerControl
      - path: src/capability/admin.ts
        symbol: setCapabilityCeiling
    tests:
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: only direct Owner Control may configure a ceiling"
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: malformed and non-boolean ceiling input is rejected"
      - path: tests/capability-ceiling-admin.test.ts
        symbol: "setCapabilityCeiling: clear is an auditable fail-closed reset"

  X0:
    kind: outcome
    description: Explicit legacy request enters the one-shot compatibility path
    result: Only the independent kingdom_start_task call with legacy_opt_in=true may select LEGACY_COMPAT

  A1:
    kind: action
    description: Resolve the trusted caller session from the complete DSH registry seam
    code:
      - path: src/index.ts
        symbol: resolveTrustedToolSession

  D1:
    kind: decision
    description: The DSH caller session is trusted and currently active
    condition: current initiator, agents.get/list, sessions.get, Agent/Session identity, running status, and non-aborted signal all match; a non-empty session_id alone is insufficient
    code:
      - path: src/index.ts
        symbol: resolveTrustedToolSession
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 每个 AUTHZ_DENIED 分支均在 runner 前 fail-closed"

  A2:
    kind: action
    description: Resolve the caller-owned active Supervisor binding and Task Territory scope
    code:
      - path: src/index.ts
        symbol: governedStartCommandContext
      - path: src/core/task-service.ts
        symbol: resolveGovernedStartSupervisor

  D2:
    kind: decision
    description: Caller session is the active Supervisor for the Task Territory
    condition: active Supervisor binding has the caller session_id and is named by the Task Territory
    code:
      - path: src/core/task-service.ts
        symbol: resolveGovernedStartSupervisor
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 同一 DSH session 的多个 Supervisor 必须解析为 Territory 指定 binding"
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 每个 AUTHZ_DENIED 分支均在 runner 前 fail-closed"
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: fallback propagates non-auth binding lookup errors without execution"

  A3:
    kind: action
    description: Parse the authenticated Supervisor capability Grant
    code:
      - path: src/index.ts
        symbol: parseSupervisorGrant

  D3:
    kind: decision
    description: Grant is a non-empty JSON object with boolean capability values
    condition: grant_json parses to a non-null non-array object whose values are booleans
    code:
      - path: src/index.ts
        symbol: parseSupervisorGrant
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 已认证 Supervisor 的 malformed Grant 是 INPUT_DENIED，且不准备 runner"

  D6:
    kind: decision
    description: The latest governed persistent Execution is terminal or absent
    condition: no Task Execution has execution_contract GOVERNED_PERSISTENT with STARTING, RUNNING, PAUSED, or RECOVERING state
    code:
      - path: src/index.ts
        symbol: runGovernedStart
      - path: src/core/execution.ts
        symbol: isTerminalExecutionState
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: unsettled persistent Execution blocks before Runtime, Session, Lease, or Dispatch effects"

  D11:
    kind: decision
    description: Worker Session side effects are allowed only after affinity and active Lease recovery guard
    condition: adapter identity is present and matches the current Worker affinity, and no Lease for that affinity or Worker is in any state other than RELEASED; the guard runs before live-handle lookup, resume, or create
    code:
      - path: src/worker/governed-executor.ts
        symbol: guardBeforeWorkerSessionSideEffect
      - path: src/core/db.ts
        symbol: getActiveLeaseForSession
    tests:
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "GI-CAP-002: cleanup false 后 RECOVERING guard 在 Session resume/create 前拒绝第二次运行"

  A4:
    kind: action
    description: After the pre-session affinity/Lease guard, establish or resume the persistent Worker Session, rebuild context-bound Runtime enforceability, and run the Capability Gate with an effective sandbox upper bound
    code:
      - path: src/worker/governed-executor.ts
        symbol: runGovernedTask
      - path: src/adapter/session-store.ts
        symbol: ensureWorkerSession
      - path: src/capability/service.ts
        symbol: runCapabilityGate
      - path: src/adapter/dsh-backend.ts
        symbol: capabilities
      - path: src/capability/dsh-enforcement.ts
        symbol: readEnforceableSet

  D4:
    kind: decision
    description: Capability Gate grants and enforces context-bound effective capabilities and required write access
    condition: Effective capability is Grant intersect Ceiling intersect the current Session EnforceableSet; coverage is informational, but a required filesystem.write must be effective or the attempt is DENIED before dispatch, and a missing ceiling is NOT_ATTEMPTED without Runtime inspection
    code:
      - path: src/capability/service.ts
        symbol: runCapabilityGate
      - path: src/capability/resolver.ts
        symbol: resolveEffectiveCapability
      - path: src/adapter/dsh-backend.ts
        symbol: capabilities
      - path: src/capability/dsh-enforcement.ts
        symbol: materializeDshEnforcement
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 正确 Supervisor 进入既有 Capability Gate，Ceiling 拒绝仍保留 cleanup"
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "governed runner: DENIED → zero execution（无 Execution/Dispatch 落库）"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: coverage PARTIAL 仅作信息字段 → 无 write requirement 时有界收窄为 read-only"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: required write 缺失于 Grant/Ceiling/Runtime → DENIED + zero dispatch"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: cleanup 不可确认 → Lease 保留 RECOVERING 且原因写入 Ledger"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: ceiling 缺失且不触碰 Runtime → DENIED+NOT_ATTEMPTED + zero execution（B-7）"

  D9:
    kind: decision
    description: Requested sandbox mode is within the effective write upper bound
    condition: workspace-write is retained only when effective.filesystem.write is true; otherwise a non-write-required request takes the read-only branch, while a read-only request for a write-required Task is denied
    code:
      - path: src/capability/service.ts
        symbol: selectSandboxMode
      - path: src/capability/resolver.ts
        symbol: resolveEffectiveCapability
    tests:
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: coverage PARTIAL 仅作信息字段 → 无 write requirement 时有界收窄为 read-only"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: coverage NONE 仍可按有效 Grant 执行；Grant 为空仍 fail-closed"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: requested read-only happy path 不扩大也不隐式收窄"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: required write 缺失于 Grant/Ceiling/Runtime → DENIED + zero dispatch"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 enforcement: read-only no-op sandbox setter 即使已有 approval 事件也不得 ENFORCED"

  A8:
    kind: action
    description: Bound a workspace-write request to read-only and persist bounded narrowing in the plan, Decision, and enforcement evidence
    code:
      - path: src/capability/service.ts
        symbol: runCapabilityGate
      - path: src/capability/service.ts
        symbol: annotateSandboxEvidence
    tests:
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: coverage PARTIAL 仅作信息字段 → 无 write requirement 时有界收窄为 read-only"
      - path: tests/m3s2-v4-s4-capability.test.ts
        symbol: "S4 gate: coverage NONE 仍可按有效 Grant 执行；Grant 为空仍 fail-closed"

  T1:
    kind: transition
    description: Atomically prepare the governed Execution, Decision binding, Dispatch Intent, and executing Lease
    entity: GovernedAttempt
    from: PREPARED
    to: INTENT_COMMITTED
    trigger: capability_granted_and_enforced
    code:
      - path: src/core/governed.ts
        symbol: prepareGovernedDispatch
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 TX-3: Runtime identity failure happens before every preparation write"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 TX-3: Intent preparation failure rolls back Execution and Decision binding"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 TX-3: Lease progression failure rolls back Intent, Execution, and Decision binding"

  A17:
    kind: action
    description: After TX-3 commit, create and acquire the exact local canonical RunnerContext Port for this dispatch before any Runtime fence or dispatch side effect; normal apply creates no broker epoch
    code:
      - path: src/core/governed.ts
        symbol: createRunnerContextPort
      - path: src/runner-context-broker.ts
        symbol: registerProductRunnerContext
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/gui-v1-vertical-flow.test.ts
        symbol: "v1 public GUI covers governed DONE, HANDOFF, execution controls, and Owner boundary"
      - path: tests/gui-governed-vertical-flow.test.ts
        symbol: "loopback GUI reaches REVIEW and preserves ACCEPT/REWORK/FAIL governance"
      - path: tests/r13-runner-context-broker.test.ts
        symbol: "R18 Product epoch activation is single-owner"

  D20:
    kind: decision
    description: Decide whether the caller explicitly created an active public run-scoped Product broker lifecycle for this dispatch
    condition: activeProductLaunch exists because an external caller explicitly invoked createRunnerContextBrokerProductLifecycle; normal apply never creates or closes it
    code:
      - path: src/index.ts
        symbol: apply
      - path: src/runner-context-broker.ts
        symbol: registerProductRunnerContext
    tests:
      - path: tests/gui-v1-vertical-flow.test.ts
        symbol: "v1 public GUI covers governed DONE, HANDOFF, execution controls, and Owner boundary"
      - path: tests/r13-runner-context-broker.test.ts
        symbol: "R18 Product epoch activation is single-owner"

  A18:
    kind: action
    description: When and only when an explicit public run-scoped lifecycle is active, register one exact Port in that epoch, issue one transport ticket, and expose only serialized bootstrap to a cross-realm consumer
    code:
      - path: src/runner-context-broker.ts
        symbol: registerRunnerContextBrokerContext
      - path: src/runner-context-broker.ts
        symbol: registerProductRunnerContext
      - path: src/runner-context-broker.ts
        symbol: connectRunnerContextBroker
    tests:
      - path: tests/r13-runner-context-broker.test.ts
        symbol: "R18 public broker exposes only bootstrap/connect/close and bounded no-ID view"
      - path: tests/r13-runner-context-broker.test.ts
        symbol: "R20 serialized cross-realm consumer connects to the existing Product broker and rejects tamper/stale/foreign bootstrap"
      - path: tests/r13-runner-context-broker.test.ts
        symbol: "R18 exact request replay is cached, mismatched replay/stale revision/foreign ticket do zero Product action"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "R18 TX-3 broker registration failure recovers all three ledgers before Runtime dispatch"

  A11:
    kind: action
    description: Open an Adapter-instance-private Runtime trust fence bound to the exact lease and Session before the governed dispatch side effect
    code:
      - path: src/adapter/contract.ts
        symbol: RuntimeTrustFence
      - path: src/adapter/dsh-backend.ts
        symbol: openTrustFence
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "governed runner: trusted terminal 后 exactly-once cleanup 使用同一 request/context"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "G14/G17 trust fence unrecognized/tainted token 在 check、cleanup、release 上均 fail-closed"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "R5 G14 exact fence binding: cross-adapter/cross-lease/cross-session 均 fail-closed 且不释放"

  A6:
    kind: action
    description: Invoke the Runtime dispatch side effect only after the Intent commit point
    code:
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
      - path: src/adapter/contract.ts
        symbol: RuntimeAdapter.dispatch
    external_call:
      system: DeepSeek Harness governed runtime
      timeout: terminal evidence polling is bounded by pollIntervalMs times maxPolls; production entry uses 1000ms times 60
      failure_behavior: Move the committed Dispatch, Lease, and Execution to RECOVERING on post-commit exception or indeterminate evidence; do not redispatch or infer Terminal from a Receipt
      failure_nodes: [C1]

  T3:
    kind: transition
    description: Record Runtime Receipt by advancing Dispatch from INTENDED through DISPATCHED to RECEIVED; Receipt remains nonterminal
    entity: GovernedAttempt
    from: INTENT_COMMITTED
    to: RECEIVED
    trigger: runtime_dispatch_receipt
    code:
      - path: src/core/governed.ts
        symbol: recordDispatchReceipt
      - path: src/core/governed.ts
        symbol: RunnerContextPort.bindRuntimeReceipt
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-domain.test.ts
        symbol: "Domain: Receipt → Correlation → Terminal Evidence（TX-3R/TX-4）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: session.events 是 getter（真实 DSH 每次访问返回新数组）→ 轮询每轮重读仍达 terminal（正式入口 E2E seam）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: correlation window 后首次同时看到 turn+terminal 时先 correlate 再 terminal"

  A12:
    kind: action
    description: Bind the accepted Runtime dispatch reference to the same fence with the exact Adapter/lease/Session expectation and advance its monotonic observation generation
    code:
      - path: src/adapter/dsh-backend.ts
        symbol: bindTrustFence
      - path: src/adapter/dsh-backend.ts
        symbol: checkTrustFence
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "G14/G17 active Lease owned-ref 前 foreign activity 不可被 ref slicing 隐藏"
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "live path: foreign user message 即使伴随 completed terminal 也只能 RECOVERING，不 cleanup/release"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "R5 G14 exact fence binding: cross-adapter/cross-lease/cross-session 均 fail-closed 且不释放"

  D8:
    kind: decision
    description: A turn for this dispatch is observed before bounded polling is exhausted
    condition: reconstructed evidence for the Runtime dispatch has a non-null turnObserved during the bounded correlation or terminal polling windows
    code:
      - path: src/dispatch/evidence.ts
        symbol: reconstructDispatchEvidence
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: session.events 是 getter（真实 DSH 每次访问返回新数组）→ 轮询每轮重读仍达 terminal（正式入口 E2E seam）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: correlation window 后首次同时看到 turn+terminal 时先 correlate 再 terminal"

  T8:
    kind: transition
    description: Correlate the observed Runtime turn and advance the Execution from STARTING to RUNNING before terminal settlement
    entity: GovernedAttempt
    from: RECEIVED
    to: CORRELATED
    trigger: runtime_turn_observed
    code:
      - path: src/core/governed.ts
        symbol: correlateRuntimeExecution
      - path: src/core/governed.ts
        symbol: RunnerContextPort.correlateRuntimeExecution
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-domain.test.ts
        symbol: "Domain: Receipt → Correlation → Terminal Evidence（TX-3R/TX-4）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: correlation window 后首次同时看到 turn+terminal 时先 correlate 再 terminal"

  D7:
    kind: decision
    description: Trusted terminal evidence is available for this correlated dispatch
    condition: reconstructed evidence has a trusted terminal outcome, completed also requires assistant message evidence, and foreignUserMessages is empty; foreign activity is untrusted even when a completed terminal-looking chain exists
    code:
      - path: src/dispatch/evidence.ts
        symbol: reconstructDispatchEvidence
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 outcome 收敛：aborted→ABORTED；blocked/error/max-tokens→FAILED（执行终态落账）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 outcome 收敛：interrupted / completed 无 assistant → 不落终态（RECOVERING 语义）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: correlation window 后首次同时看到 turn+terminal 时先 correlate 再 terminal"
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "live path: foreign user message 即使伴随 completed terminal 也只能 RECOVERING，不 cleanup/release"

  T4:
    kind: transition
    description: After the same Runtime fence passes the pre-terminal cleanup reservation checks, persist terminal Dispatch evidence, terminal Execution, and Lease SETTLING state
    entity: GovernedAttempt
    from: CORRELATED
    to: TERMINAL_PROVEN
    trigger: trusted_terminal_evidence_and_fence_settlement_valid
    code:
      - path: src/core/governed.ts
        symbol: recordTerminalEvidence
      - path: src/core/governed.ts
        symbol: RunnerContextPort.observeTerminal
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-domain.test.ts
        symbol: "Domain: Receipt → Correlation → Terminal Evidence（TX-3R/TX-4）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 outcome 收敛：aborted→ABORTED；blocked/error/max-tokens→FAILED（执行终态落账）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: correlation window 后首次同时看到 turn+terminal 时先 correlate 再 terminal"
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "G14/G17 late foreign TOCTOU: terminal 观察后 cleanup 前污染仍三层 RECOVERING 且 disposer=0"

  C1:
    kind: compensation
    description: Atomically move the related Dispatch, Lease, and Execution into RECOVERING
    restores_or_resolves: Preserve the unproven Runtime outcome without duplicate execution, false release, or Task mutation
    failure_behavior: Validate all relationships first; on a post-commit exception recover all three rows then rethrow the original error, or expose both errors through AggregateError if recovery fails
    code:
      - path: src/core/governed.ts
        symbol: markGovernedDispatchRecovering
      - path: src/dispatch/reconcile.ts
        symbol: applyRecovery
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: terminal poll exhaustion atomically returns all three current RECOVERING rows"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 recovery seam rolls back Dispatch and Lease when Execution recovery fails"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: late correlation 写入异常后原子进入三层 RECOVERING"

  T5:
    kind: transition
    description: Indeterminate or untrusted evidence makes the governed attempt recovery-required
    entity: GovernedAttempt
    from: "INTENT_COMMITTED | RECEIVED | CORRELATED"
    to: RECOVERING
    trigger: dispatch_exception_or_terminal_poll_exhausted_or_foreign_user_message_or_reconcile_indeterminate
    code:
      - path: src/core/governed.ts
        symbol: markGovernedDispatchRecovering
      - path: src/dispatch/reconcile.ts
        symbol: decideRecovery
      - path: src/dispatch/reconcile.ts
        symbol: applyRecovery
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 crash matrix: 各 Crash 点的恢复决策（不改 Task 治理、不重复执行、不伪造 terminal）"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: terminal poll exhaustion atomically returns all three current RECOVERING rows"
      - path: tests/m3s2-v4-s5-dispatch.test.ts
        symbol: "S5 dispatch: late correlation 写入异常后原子进入三层 RECOVERING"
      - path: tests/m3s2-v4-governed-runner.test.ts
        symbol: "live path: foreign user message 即使伴随 completed terminal 也只能 RECOVERING，不 cleanup/release"

  A7:
    kind: action
    description: Check the exact Adapter/lease/Session terminal-write fence, reserve Runtime ingress, and invoke exactly-once cleanup with the exact materialized request and same context
    code:
      - path: src/worker/governed-executor.ts
        symbol: cleanupAfterTrustedTerminal
      - path: src/adapter/dsh-backend.ts
        symbol: cleanupWithFence
      - path: src/dispatch/service.ts
        symbol: runGovernedDispatch
    tests:
