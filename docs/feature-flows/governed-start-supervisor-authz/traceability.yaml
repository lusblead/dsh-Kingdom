  X1:
    kind: outcome
    description: Missing or unresolvable caller principal is rejected
    result: AUTHZ_DENIED with no governed preparation

  X2:
    kind: outcome
    description: Caller role or Territory scope is rejected
    result: AUTHZ_DENIED with no governed preparation

  X3:
    kind: outcome
    description: Authenticated Supervisor supplied malformed Grant JSON
    result: INPUT_DENIED with no governed preparation

  X4:
    kind: outcome
    description: Capability governance denies the authorized request
    result: CAPABILITY_DENIED with existing zero-execution cleanup and no Runtime dispatch or Claim

  X5:
    kind: outcome
    description: Trusted terminal evidence yields a Worker Claim awaiting Supervisor review
    result: Task is REVIEW; Runtime terminal or Worker Claim alone is not DONE; SESSION_STOPPED is only the emitted event label and the persistent Runtime Session is not stopped

  X6:
    kind: outcome
    description: Capability ceiling setup is rejected
    result: CONFIG_DENIED or INPUT_DENIED with no ceiling or audit-event write; governed start is a separate entry

  X7:
    kind: outcome
    description: Existing persistent Execution is unsettled
    result: Denied before Runtime, Session, Lease, Decision, Execution, or Dispatch effects; Task and ledgers remain unchanged

  X12:
    kind: outcome
    description: Worker Session reuse is blocked by an active or recovering Lease guard
    result: Return recovery-required without live handle lookup, Session resume/create, new Lease, or Dispatch; reconcile the existing Lease before retry

  X13:
    kind: outcome
    description: A post-TX-4 terminal integrity incident keeps the Claim reviewable but prevents release or Session reuse
    result: Preserve terminal Dispatch/Execution and Claim/REVIEW; move SETTLING/RELEASING Lease to RECOVERING with one bounded redacted incident, or retain RELEASED history while escalating a late mismatch

  X14:
    kind: outcome
    description: Supervisor explicitly chooses REWORK or FAIL for the Claim
    result: Apply the selected governance decision; the open terminal-integrity incident does not silently convert REWORK or FAIL into ACCEPT denial

  X15:
    kind: outcome
    description: The exact Claim is accepted after the incident-free same-transaction gate
    result: Task becomes DONE, active assignment closes, and TASK_ACCEPTED records the Claim as organization fact

  X16:
    kind: outcome
    description: ACCEPT is blocked by the exact open terminal-integrity incident
    result: Return CLAIM_INTEGRITY_BLOCKED with zero TASK_ACCEPTED, zero DONE transition, and zero assignment closure

  X11:
    kind: outcome
    description: Trusted terminal Claim remains recovery-required because cleanup is not confirmed
    result: Preserve Claim and Task REVIEW with Lease RECOVERING; omit SESSION_STOPPED and block Session reuse and new Dispatch until reconciliation

  X8:
    kind: outcome
    description: Runtime outcome remains recovery-required
    result: Dispatch, Lease, and Execution are RECOVERING; Task is unchanged; no redispatch, release, new attempt, or fake terminal

  X9:
    kind: outcome
    description: Capability ceiling fact is updated or cleared through direct Owner Slash
    result: Persisted ceiling and audit event reflect the validated request; subsequent governed execution remains subject to the independent Capability Gate

  X10:
    kind: outcome
    description: Legacy Tool invocation omitted explicit compatibility opt-in
    result: LEGACY_COMPAT_REQUIRED with zero one-shot execution and no fallback from governed persistent
