version: 1
feature_id: "gui.local-control-session"
title: "Local GUI Control Session"
status: "implemented"

characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: true
  security_sensitive: true

nodes:
  E1:
    kind: entry
    description: Direct local GUI activation command
    trigger: /kingdom gui or /kingdom gui start, with /kingdom gui stop as the revocation entry
    code:
      - path: src/index.ts
        symbol: apply

  D1:
    kind: decision
    description: GUI command action is recognized
    condition: raw input after /kingdom gui is empty, start, or stop
    code:
      - path: src/index.ts
        symbol: directCommandParts
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "port=0 activates only against the actual listening Origin and keeps transport secrets out of result/logger/event payloads"

  A1:
    kind: action
    description: Start the local GUI server and await its actual listening address
    code:
      - path: src/index.ts
        symbol: ensureGuiServer
      - path: src/gui/server.ts
        symbol: startGuiServer

  A2:
    kind: action
    description: Revoke active sessions and close the GUI runtime
    code:
      - path: src/index.ts
        symbol: stopGuiServer
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.dispose
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket/session TTL, revoke, replacement, and dispose abort active control contexts"

  D2:
    kind: decision
    description: Server has a concrete loopback Origin
    condition: startGuiServer onListening reports host 127.0.0.1 and an actual port, including port 0
    code:
      - path: src/gui/server.ts
        symbol: startGuiServer
      - path: src/index.ts
        symbol: ensureGuiServer
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "port=0 activates only against the actual listening Origin and keeps transport secrets out of result/logger/event payloads"

  A3:
    kind: action
    description: Capture the exact DSH Agent and mint a one-time in-memory launch ticket without Owner capability
    code:
      - path: src/index.ts
        symbol: LocalControlManager.activate
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.activate
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket redemption is one-time and captures the exact Agent/session without Owner capability"

  A4:
    kind: action
    description: Pass the ticket URL only to the local browser opener
    code:
      - path: src/index.ts
        symbol: openLocalConsole

  D3:
    kind: decision
    description: Local browser launch reports success
    condition: platform URL opener returns a successful process status
    code:
      - path: src/index.ts
        symbol: openLocalConsole
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "port=0 activates only against the actual listening Origin and keeps transport secrets out of result/logger/event payloads"

  X1:
    kind: outcome
    description: Invalid GUI command grammar is rejected
    result: INPUT_DENIED with no GUI session mutation

  X2:
    kind: outcome
    description: GUI server cannot become available
    result: RECOVERY_REQUIRED with the external outcome unproven and without a returned launch ticket

  X3:
    kind: outcome
    description: Browser launch was requested successfully
    result: Clean command result contains Origin, expiry, and launch status only

  X4:
    kind: outcome
    description: Browser launch failed
    result: Clean Console URL and honest launch failure; one-time ticket is not printed

  E2:
    kind: entry
    description: Browser redeems launch ticket or reads control status
    trigger: GET /console?ticket or GET /api/control
    code:
      - path: src/gui/server.ts
        symbol: startGuiServer

  D4:
    kind: decision
    description: Read transport is exact loopback with null or exact Origin
    condition: Host and remote address are exact loopback and read Origin is absent or equals expected Origin
    code:
      - path: src/gui/local-control.ts
        symbol: validateTransport
      - path: src/gui/local-control.ts
        symbol: isExactLoopbackHost
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "same-origin GET without Origin can inspect, while mutation without/external Origin is zero-effect denied"
      - path: tests/gui-local-control-security.test.ts
        symbol: "loopback and Origin admission use the exact local transport boundary"

  X5:
    kind: outcome
    description: Read transport is foreign
    result: CONTROL_ORIGIN_DENIED with no session or command effect

  D5:
    kind: decision
    description: Launch ticket or session is live and not replayed
    condition: Ticket exists within TTL for redemption, or cookie identifies a non-expired non-revoked session for inspection
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.redeem
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.sessionFor
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket redemption is one-time and captures the exact Agent/session without Owner capability"
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket/session TTL, revoke, replacement, and dispose abort active control contexts"

  X6:
    kind: outcome
    description: Ticket or session admission failed
    result: CONTROL_TICKET_INVALID, CONTROL_SESSION_REQUIRED, or CONTROL_SESSION_EXPIRED

  A5:
    kind: action
    description: Consume ticket, create bounded session, set transport cookie, and redirect cleanly
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.redeem
      - path: src/gui/server.ts
        symbol: startGuiServer
    tests:
      - path: tests/gui-control-server.test.ts
        symbol: "local control HTTP wiring denies raw POST and passes only broker context"

  A6:
    kind: action
    description: Inspect and return the public control view, including canonical session commands, review decisions, sandbox modes, and non-executable Owner-only guidance
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.inspect
      - path: src/gui/control-contract.ts
        symbol: GuiControlPublicView
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "same-origin GET without Origin can inspect, while mutation without/external Origin is zero-effect denied"
      - path: tests/gui-local-control-security.test.ts
        symbol: "v1 control view advertises session commands and keeps Owner-only actions direct-Slash-only"

  E3:
    kind: entry
    description: Browser submits one GUI command
    trigger: POST /api/commands/:name
    code:
      - path: src/gui/server.ts
        symbol: startGuiServer

  D6:
    kind: decision
    description: Mutation transport admission is complete
    condition: exact Origin, valid cookie and CSRF, unique request id, live session, and no in-flight mutation
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.authorize
      - path: src/gui/server.ts
        symbol: startGuiServer
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "same-origin GET without Origin can inspect, while mutation without/external Origin is zero-effect denied"
      - path: tests/gui-local-control-security.test.ts
        symbol: "CSRF, request replay, and concurrent mutation admission fail closed"

  X7:
    kind: outcome
    description: Mutation admission failed
    result: Stable control error before runGuiCommand, Core, or Runtime

  A7:
    kind: action
    description: Return captured Agent/session execution context and serialize the mutation
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.authorize
      - path: src/gui/server.ts
        symbol: startGuiServer

  D7:
    kind: decision
    description: Strict command body and captured Role identity are valid
    condition: Body is one strict JSON object with no duplicate keys, nested Authority-shaped aliases, unrecognized top-level fields, or non-string values; Role identity comes only from the activation context and GUI has no Owner capability
    code:
      - path: src/gui/control-contract.ts
        symbol: parseStrictJsonObject
      - path: src/gui/server.ts
        symbol: validateCommandPayload
      - path: src/index.ts
        symbol: runGuiCommand
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "forged browser identity fields have zero effect on the opaque activation context"
      - path: tests/gui-control-server.test.ts
        symbol: "GUI command payload grammar rejects authority aliases, duplicates, nesting, and per-command unrecognized fields"
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  X8:
    kind: outcome
    description: Strict body or captured-authority validation rejected the command
    result: INVALID_BODY or stable authentication rejection; the admitted slot is finished and runGuiCommand, Core, Runtime, and domain revision remain untouched

  D8:
    kind: decision
    description: Select the GUI command branch
    condition: plan, assign, review, execution.pause/resume/abort, or start matches the canonical session command name
    code:
      - path: src/index.ts
        symbol: runGuiCommand
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  A10:
    kind: action
    description: GUI forwards the optional non-authoritative capability requirement to core planTask, which creates the Task and requirement in one transaction; no legacy second write remains
    code:
      - path: src/gui/control-contract.ts
        symbol: GUI_SESSION_COMMANDS
      - path: src/gui/control-contract.ts
        symbol: GUI_COMMAND_PAYLOAD_FIELDS
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/index.ts
        symbol: MINIMAL_CAPABILITY_JSON
      - path: src/core/task-service.ts
        symbol: planTask
      - path: src/core/db.ts
        symbol: KingdomStore.insertTask
    tests:
      - path: tests/gui-v1-vertical-flow.test.ts
        symbol: "v1 public GUI covers governed DONE, HANDOFF, execution controls, and Owner boundary"
      - path: tests/gui-local-control-security.test.ts
        symbol: "fresh governed setup prerequisites keep Worker unbound and prepare ceiling/profile/task requirement"

  X11:
    kind: outcome
    description: Task planning prepared Capability Gate coverage
    result: When the plan transaction commits, the new Task has the optional capability requirement; Task and requirement do not split across the transaction boundary
    tests:
      - path: tests/gui-v1-vertical-flow.test.ts
        symbol: "v1 public GUI covers governed DONE, HANDOFF, execution controls, and Owner boundary"

  X28:
    kind: outcome
    description: Task, requirement, or plan event write fails
    result: The plan transaction rolls back; no partial Task or capability requirement remains

  A11:
    kind: action
    description: Run the existing session-bound assign command
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: assignTask

  X12:
    kind: outcome
    description: Assignment command settles
    result: CommandResultView and Projection refresh retain the existing assignment and live allowedActions semantics

  A12:
    kind: action
    description: Use shared governed persistent start with captured Agent, separate Grant, and the exact validated sandbox mode
    code:
      - path: src/index.ts
        symbol: runGovernedStart
    external_call:
      system: DeepSeek Harness governed runtime
      timeout: 1000ms x 60 polling window
      failure_behavior: Preserve fail-closed denial or RECOVERY_REQUIRED with the external outcome unproven; do not auto-retry or select LEGACY_COMPAT
      failure_nodes: [D10, X13]
      retry:
        max_attempts: 1
        backoff: No automatic retry; require manual Projection reconciliation before a new direct command
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 正确 Supervisor 进入既有 Capability Gate，Ceiling 拒绝仍保留 cleanup"
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  D10:
    kind: decision
    description: Existing Supervisor, capability, and runtime gates allow governed execution
    condition: Captured session resolves in scope, Grant is valid, and Capability Gate is GRANTED plus ENFORCED
    code:
      - path: src/index.ts
        symbol: runGovernedStart
      - path: src/capability/service.ts
        symbol: runCapabilityGate
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 每个 AUTHZ_DENIED 分支均在 runner 前 fail-closed"
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "public governed start: 已认证 Supervisor 的 malformed Grant 是 INPUT_DENIED，且不准备 runner"

  X13:
    kind: outcome
    description: Governed start denied or externally uncertain
    result: CAPABILITY_DENIED, AUTHZ_DENIED, or RECOVERY_REQUIRED with the external outcome unproven; no automatic legacy fallback

  X14:
    kind: outcome
    description: Governed Worker result is a Claim in REVIEW
    result: Supervisor review alone may produce DONE, REWORK, FAIL, or an atomic HANDOFF to RUNNING
    tests:
      - path: tests/gui-governed-vertical-flow.test.ts
        symbol: "loopback GUI reaches REVIEW and preserves ACCEPT/REWORK/FAIL governance"

  D11:
    kind: decision
    description: Classify the requested HTTP command name before broker authorization
    condition: Name is a canonical session command, a deny-only Owner action, or unrecognized
    code:
      - path: src/gui/control-contract.ts
        symbol: GUI_SESSION_COMMANDS
      - path: src/gui/control-contract.ts
        symbol: GUI_OWNER_ONLY_HTTP_COMMANDS
      - path: src/gui/server.ts
        symbol: startGuiServer
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "v1 control view advertises session commands and keeps Owner-only actions direct-Slash-only"
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  D12:
    kind: decision
    description: Validate review state, Supervisor scope, decision payload, and HANDOFF target
    condition: Task is in REVIEW; the caller supervises its Territory; decision is canonical; HANDOFF includes reason and an ACTIVE target Worker binding in the same Territory
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: reviewTask
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  D13:
    kind: decision
    description: Validate requested execution control against live execution state and Supervisor scope
    condition: Exact captured session resolves to the in-scope Supervisor and canonical Core LEGACY_COMPAT control semantics admit pause, resume, or abort for the current execution state; GOVERNED_PERSISTENT remains fail-closed
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: pauseExecution
      - path: src/core/task-service.ts
        symbol: resumeExecution
      - path: src/core/task-service.ts
        symbol: abortExecution
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  D14:
    kind: decision
    description: Governed start sandbox mode is canonical
    condition: sandbox_mode is absent or exactly workspace-write or read-only
    code:
      - path: src/gui/control-contract.ts
        symbol: GUI_START_SANDBOX_MODES
      - path: src/index.ts
        symbol: runGovernedStart
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  A13:
    kind: action
    description: Forward the complete ACCEPT, REWORK, FAIL, or HANDOFF review payload to Core
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: reviewTask
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  A14:
    kind: action
    description: Invoke the canonical pause, resume, or abort Core operation
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: pauseExecution
      - path: src/core/task-service.ts
        symbol: resumeExecution
      - path: src/core/task-service.ts
        symbol: abortExecution
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  X15:
    kind: outcome
    description: Owner-only HTTP command name is fenced before broker or Core dispatch
    result: HTTP 403 DIRECT_SLASH_REQUIRED; advertised action remains executable=false and domain state is unchanged
    code:
      - path: src/gui/server.ts
        symbol: startGuiServer
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "v1 control view advertises session commands and keeps Owner-only actions direct-Slash-only"
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  X16:
    kind: outcome
    description: Unrecognized command, invalid payload, illegal state, unauthorized caller, replay, expiry, revoke, or aborted context is rejected
    result: Stable error and zero additional assignment, execution, follow-up, Core, or Runtime effect
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  X17:
    kind: outcome
    description: Legal execution control settles through the existing state machine
    result: Only the canonical execution runtime fact changes; Task governance state is not invented or widened
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  X18:
    kind: outcome
    description: Review settles through the existing Supervisor gate
    result: ACCEPT, REWORK, and FAIL retain existing semantics; HANDOFF atomically closes the old assignment and creates the linked target assignment
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  G1:
    kind: safeguard
    description: Direct activation provenance and exact Agent capture
    safeguard_type: authentication
    guarantee: Direct Slash activation binds Role context to the activation-time Agent/session without placing Owner capability in the GUI context
    protects: [A3, D7]
    failure_behavior: Missing exact Agent/session returns a stable failure before GUI Core writes or governed start
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.activate
      - path: src/index.ts
        symbol: runGuiCommand
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket redemption is one-time and captures the exact Agent/session without Owner capability"

  G2:
    kind: safeguard
    description: Exact local transport boundary with read Origin exception
    safeguard_type: authorization
    guarantee: Loopback Host/remote are exact; inspect GET accepts null or exact Origin, while authorize mutation requires exact Origin
    protects: [D4, D6]
    failure_behavior: Return CONTROL_ORIGIN_DENIED before Core or Runtime
    code:
      - path: src/gui/local-control.ts
        symbol: validateTransport
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.inspect
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "same-origin GET without Origin can inspect, while mutation without/external Origin is zero-effect denied"

  G3:
    kind: safeguard
    description: One-time session, CSRF, replay, and concurrency controls
    safeguard_type: validation
    guarantee: A ticket is consumed once; each request id is admitted once; only one mutation is in flight; expiry/revoke/dispose aborts contexts
    protects: [D5, D6, A7]
    failure_behavior: Return a stable control failure and leave domain state untouched
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.authorize
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.revoke
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "CSRF, request replay, and concurrent mutation admission fail closed"
      - path: tests/gui-local-control-security.test.ts
        symbol: "ticket/session TTL, revoke, replacement, and dispose abort active control contexts"

  G4:
    kind: safeguard
    description: Launch secret privacy boundary
    safeguard_type: privacy
    guarantee: Ticket, cookie, CSRF, and request id are not placed in CommandResult text, logger output, or domain/event payloads
    protects: [A4, X3, X4]
    failure_behavior: Return only a clean Origin/Console URL/expiry and an honest launch status
    code:
      - path: src/index.ts
        symbol: formatGuiLaunchCommandResult
      - path: src/index.ts
        symbol: openLocalConsole
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "port=0 activates only against the actual listening Origin and keeps transport secrets out of result/logger/event payloads"

  G5:
    kind: safeguard
    description: Owner capability and browser identity separation
    safeguard_type: authorization
    guarantee: Browser payload fields cannot construct Owner capability, principal, Agent, actor, ticket, or CSRF authority; the GUI execution context contains no Owner capability
    protects: [A7, D7]
    failure_behavior: Reject forbidden fields before runGuiCommand/Core/Runtime
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.authorize
      - path: src/index.ts
        symbol: runGuiCommand
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "forged browser identity fields have zero effect on the opaque activation context"
      - path: tests/gui-control-server.test.ts
        symbol: "local control HTTP wiring denies raw POST and passes only broker context"

  G7:
    kind: safeguard
    description: Bounded Task requirement without implied Owner prerequisite setup
    safeguard_type: authorization
    guarantee: Core planTask writes only the optional non-authoritative Task requirement in the same transaction as Task creation and cannot initialize or widen Owner facts; missing ceiling or Worker profile fails closed later in governed start
    protects: [A10, A12, D10]
    failure_behavior: A Task, requirement, or event write exception rolls back the plan transaction; the single GUI-to-planTask call has no second requirement write, while missing ceiling/profile or an empty requirement remains fail-closed at the governed-start gate when no effective capability exists
    code:
      - path: src/index.ts
        symbol: MINIMAL_CAPABILITY_JSON
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/index.ts
        symbol: runGovernedStart
      - path: src/core/binding.ts
        symbol: setExecutionProfile
      - path: src/capability/admin.ts
        symbol: setCapabilityCeiling
    tests:
      - path: tests/gui-v1-vertical-flow.test.ts
        symbol: "v1 public GUI covers governed DONE, HANDOFF, execution controls, and Owner boundary"
      - path: tests/gui-local-control-security.test.ts
        symbol: "fresh governed setup prerequisites keep Worker unbound and prepare ceiling/profile/task requirement"

  G8:
    kind: safeguard
    description: Canonical governed start and no automatic fallback
    safeguard_type: authorization
    guarantee: GUI start enters the same runGovernedStart seam and never silently selects LEGACY_COMPAT after a persistent failure
    protects: [A12, D10]
    failure_behavior: Preserve CAPABILITY_DENIED or RECOVERY_REQUIRED with the external outcome unproven and require operator reconciliation
    code:
      - path: src/index.ts
        symbol: runGovernedStart
    tests:
      - path: tests/governed-start-supervisor-authz.test.ts
        symbol: "headless route contract: governed failure never suggests legacy fallback"

  G9:
    kind: safeguard
    description: Owner-only actions remain direct-Slash-only
    safeguard_type: authorization
    guarantee: Canonical init, reset, ceiling, territory, role, session, and profile actions are advertised only as executable=false with DIRECT_SLASH_REQUIRED guidance; retired setup.basic is not advertised, and every Owner-only spelling is deny-only over HTTP
    protects: [D11, X15]
    failure_behavior: Return HTTP 403 before broker authorization, Host dispatch, Core, or Runtime
    code:
      - path: src/gui/control-contract.ts
        symbol: GUI_OWNER_ONLY_ACTIONS
      - path: src/gui/server.ts
        symbol: startGuiServer
      - path: src/index.ts
        symbol: runGuiCommand
    tests:
      - path: tests/gui-local-control-security.test.ts
        symbol: "v1 control view advertises session commands and keeps Owner-only actions direct-Slash-only"
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  G10:
    kind: safeguard
    description: Complete HANDOFF review payload and atomic Core transition
    safeguard_type: atomicity
    guarantee: Host forwards reason and to_binding_id without reconstructing authority; Core validates live state, scope, and target before atomically replacing the assignment
    protects: [D12, A13, X18]
    failure_behavior: Missing or invalid target, wrong task state, or out-of-scope caller returns without changing assignment or Task revision
    code:
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: reviewTask
    tests:
      - path: tests/gui-v1-command-surface.test.ts
        symbol: "v1 GUI command surface is session-bound, state-safe, replay-safe, and direct-Slash fenced"

  G11:
    kind: safeguard
    description: Execution controls preserve session, scope, state, and replay boundaries
    safeguard_type: authorization
    guarantee: pause, resume, and abort use the activation-time session and canonical Core checks; same-request replay, illegal or terminal state, expired/revoked admission, and unauthorized requests are zero-effect. Distinct valid LEGACY_COMPAT pause requests may refresh pause_requested_at, so no cross-request idempotency is claimed
    protects: [D6, D7, D13, A14, X17]
    failure_behavior: Return the existing stable admission, authorization, or state error with no additional execution event or runtime effect
    code:
      - path: src/gui/local-control.ts
        symbol: LocalControlManager.authorize
      - path: src/index.ts
        symbol: runGuiCommand
      - path: src/core/task-service.ts
        symbol: pauseExecution
      - path: src/core/task-service.ts
        symbol: resumeExecution
      - path: src/core/task-service.ts
