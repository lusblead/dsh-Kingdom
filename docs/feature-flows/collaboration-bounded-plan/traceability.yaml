        symbol: "advance requires exact adopted plan and current session-bound Supervisor before any assignment"
      - path: "tests/collaboration-advance.test.ts"
        symbol: "advance preflights the entire batch scope and rejects duplicate or invalid Grant inputs with zero writes"
