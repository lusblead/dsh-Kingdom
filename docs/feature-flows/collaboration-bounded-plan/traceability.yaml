version: 1
feature_id: "collaboration.bounded-plan"
title: "Explicit bounded personal collaboration plan"
status: "implemented"
characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: true
  security_sensitive: true
evidence_status: "Source reconciled; 460 tests, official isolated DSH journey and 16 browser scenarios passed; human acceptance separate"
nodes:
  E1:
    kind: "entry"
    description: "Current Chancellor explicitly proposes bounded collaboration"
    trigger: "Explicit bounded collaboration proposal"
    code:
      - path: "src/core/collaboration.ts"
        symbol: "proposeCollaborationPlan"
  D1:
    kind: "decision"
    description: "Reject invalid parent, recursive graph, excess workers and invalid scoped members"
    condition: "Parent is root CREATED; plan is one-level acyclic with valid current members and no more than three distinct Workers including integrator"
    code:
      - path: "src/core/collaboration.ts"
        symbol: "proposeCollaborationPlan"
    tests:
      - path: "tests/collaboration.test.ts"
        symbol: "proposal rejects recursive parents, duplicate members, extra fields and cyclic or foreign dependencies without writes"
  T1:
    kind: "transition"
    description: "Record immutable versioned proposal content"
    entity: "CollaborationPlan"
    from: "Absent"
    to: "PROPOSED"
    trigger: "Valid current Chancellor proposal"
    code:
      - path: "src/core/collaboration.ts"
        symbol: "proposeCollaborationPlan"
    tests:
      - path: "tests/collaboration.test.ts"
        symbol: "proposal rejects recursive parents, duplicate members, extra fields and cyclic or foreign dependencies without writes"
  A1:
    kind: "action"
    description: "Project complete current plan, responsible integrator and soft-budget scope"
    code:
      - path: "src/gui/snapshot.ts"
        symbol: "buildWorkbenchCollaboration"
      - path: "src/gui/workbench-ui.ts"
        symbol: "renderCollaboration"
    tests:
      - path: "tests/v15-collaboration-gui.test.ts"
        symbol: "collaboration projection is read-only and distinguishes one plan adoption from dependency readiness and parent integration"
      - path: "tests/v15-collaboration-gui.test.ts"
        symbol: "collaboration plan display is bounded without turning omitted plans into a complete list"
  E2:
    kind: "entry"
    description: "Human prepares and commits one exact plan in the independent Owner window"
    trigger: "Explicit plan.adopt via Owner prepare and commit"
    code:
      - path: "src/gui/owner-ui.ts"
        symbol: "payload"
      - path: "src/gui/owner-ui.ts"
        symbol: "plan.adopt"
      - path: "src/gui/owner-control.ts"
