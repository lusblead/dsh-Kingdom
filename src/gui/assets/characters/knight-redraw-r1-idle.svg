<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 112" width="80" height="112" preserveAspectRatio="xMidYMid meet" role="img" focusable="false" aria-labelledby="character-title character-desc" data-role="knight" data-state="idle">
<title id="character-title">Kingdom 执行者 · idle</title>
<desc id="character-desc">护额、分片护甲、短披风和工具。重心就位，抬臂检视工具，回收待续。克制的连续关节动作，支持减少动态效果。</desc>
<metadata>{"visualVersion":"kingdom-motion-r4-gui","role":"knight","state":"idle","cycleSeconds":8,"viewBox":[0,0,80,112],"origin":"Owner character redesign authorized 2026-09-08"}</metadata>
<style><![CDATA[
/* SVG-wide coordinates make every joint pivot explicit and stable. */
svg{overflow:hidden;--phase:-2.6s}
.weight,.breath,.head,.cape,.arm-far,.forearm-far,.arm-near,.forearm-near,.hat-follow{transform-box:view-box}
.weight{transform-origin:40px 99px;animation:weight 8s cubic-bezier(.42,0,.58,1) infinite}
.breath{transform-origin:40px 87px;animation:breathe 4s cubic-bezier(.37,0,.63,1) var(--phase) infinite}
.head{transform-origin:40px 44px;animation:idle-look 8s cubic-bezier(.4,0,.4,1) infinite}
.cape{transform-origin:40px 48px;animation:cloth 8s cubic-bezier(.4,0,.5,1) infinite}
.arm-far{transform-origin:27px 51px}.forearm-far{transform-origin:22px 64px}
.arm-near{transform-origin:54px 51px}.forearm-near{transform-origin:58px 63px}
.hat-follow{transform-origin:49px 18px;animation:hat-settle 8s ease-in-out infinite}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 8s linear var(--phase) infinite}
.eyes-closed{display:none}
svg:is([data-state="idle"],[data-state="ready"],[data-state="available"]) .arm-near{animation:idle-shoulder 8s cubic-bezier(.42,0,.24,1) infinite}
svg:is([data-state="idle"],[data-state="ready"],[data-state="available"]) .forearm-near{animation:idle-hand 8s cubic-bezier(.42,0,.24,1) infinite}
svg:is([data-state="working"],[data-state="running"],[data-state="executing"],[data-state="reviewing"]) .weight{animation-name:work-weight}
svg:is([data-state="working"],[data-state="running"],[data-state="executing"],[data-state="reviewing"]) .head{animation-name:work-look}
svg:is([data-state="working"],[data-state="running"],[data-state="executing"],[data-state="reviewing"]) .arm-far{animation:steady-page 8s ease-in-out infinite}
svg:is([data-state="working"],[data-state="running"],[data-state="executing"],[data-state="reviewing"]) .arm-near{animation:knight-shoulder 8s cubic-bezier(.42,0,.24,1) infinite}
svg:is([data-state="working"],[data-state="running"],[data-state="executing"],[data-state="reviewing"]) .forearm-near{animation:knight-gesture 8s cubic-bezier(.42,0,.24,1) infinite}
svg:is([data-state="thinking"],[data-state="confused"],[data-state="planning"],[data-state="waiting-input"]) .head{transform:rotate(-5deg);animation:consider 8s ease-in-out infinite}
svg:is([data-state="thinking"],[data-state="confused"],[data-state="planning"],[data-state="waiting-input"]) .forearm-near{transform:rotate(-18deg);animation:thinking-hand 8s ease-in-out infinite}
svg:is([data-state="thinking"],[data-state="confused"],[data-state="planning"],[data-state="waiting-input"]) .arm-near{transform:rotate(-6deg);animation:thinking-shoulder 8s ease-in-out infinite}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .head{transform:rotate(9deg) translateY(1px);animation:rest-head 8s ease-in-out infinite}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .arm-near{transform:rotate(9deg)}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .arm-far{transform:rotate(-5deg)}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .forearm-near{transform:rotate(8deg)}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .eyes-open{display:none}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .eyes-closed{display:inline}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .weight{animation:none;transform:rotate(.4deg)}
svg:is([data-state="sleeping"],[data-state="paused"],[data-state="resting"]) .breath{animation-duration:4s}
svg:is([data-state="offline"],[data-state="stopped"],[data-state="absent"]) .figure,svg:is([data-state="offline"],[data-state="stopped"],[data-state="absent"]) .ground-shadow{display:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}42%{transform:scale(1.01,1.028)}68%{transform:scale(1.005,1.013)}}
@keyframes weight{0%,100%{transform:rotate(0deg)}20%,35%{transform:rotate(-6deg)}64%,78%{transform:rotate(5deg)}}
@keyframes work-weight{0%,7%,100%{transform:rotate(0deg)}14%{transform:rotate(3deg)}28%,39%{transform:rotate(-8deg)}51%{transform:rotate(-3deg)}63%,72%{transform:rotate(4deg)}83%,91%{transform:rotate(-5deg)}}
@keyframes cloth{0%,100%{transform:rotate(0deg)}16%{transform:rotate(-4deg)}33%,43%{transform:rotate(9deg)}53%{transform:rotate(3deg)}71%,83%{transform:rotate(-7deg)}93%{transform:rotate(3deg)}}
