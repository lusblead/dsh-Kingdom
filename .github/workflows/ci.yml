name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (tsc build + node --test)
        run: npm test

      - name: Governance and recovery smoke (isolated fixtures)
        run: node scripts/p2-smoke.mjs

      - name: GUI and Owner journey smoke
        run: node scripts/p3-smoke.mjs

      - name: Lifecycle and recovery smoke
        run: node scripts/hotplug-audit.mjs

      - name: Package check
        run: npm pack --dry-run
