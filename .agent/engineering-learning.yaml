version: 3

project:
  id: dsh-kingdom
  name: dsh-Kingdom
  status: active
  # 一个项目可以同时属于多个类型。使用小写 kebab-case；可增加自定义类型。
  profiles:
    - agent-system
    - infrastructure-automation

documents:
  ai_project_experience: .agent/PROJECT_EXPERIENCE.md
  # 给人阅读的工程经验只在 Obsidian 中维护，不再写入项目仓库。
  human_engineering_lessons: 'C:\Users\ADMIN\Documents\Obsidian Vault\工程实践经验\projects\dsh-kingdom\ENGINEERING_LESSONS.md'

global_library:
  enabled: true
  # Windows 默认路径；WSL 对应 /mnt/c/Users/ADMIN/Documents/Obsidian Vault/工程实践经验。
  root: 'C:\Users\ADMIN\Documents\Obsidian Vault\工程实践经验'
  index: INDEX.md
  project_types_dir: project-types
  shared_document: shared/CROSS_PROJECT_ENGINEERING_PRINCIPLES.md

  recall:
    max_project_entries: 5
    max_global_entries: 5

  promotion:
    # learn 时自动检查是否应更新全局库；没有可迁移知识时保持不变。
    enabled: true
    single_project_maturity: emerging
    require_local_evidence: true
